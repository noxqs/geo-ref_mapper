# Builds a Linux x86_64 release and attaches it to a GitHub release whenever a
# version tag (v0.6.0, v0.7.0, ...) is pushed. Can also be run by hand from the
# Actions tab, which builds the artifact without publishing a release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    # The oldest supported runner, so the binary links against an older glibc
    # and runs on more distributions than one built on the newest.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: System packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config nasm libx11-dev libxkbcommon-dev libwayland-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          name="geo-ref_mapper-${GITHUB_REF_NAME}-x86_64-linux"
          mkdir "$name"
          cp target/release/geo-ref_mapper "$name/"
          strip "$name/geo-ref_mapper"
          tar czf "$name.tar.gz" "$name"
          echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE }}
          path: ${{ env.ARCHIVE }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ARCHIVE }}
          generate_release_notes: true
